    async function checkScheduledEvents(isVisibilityWake = false) {
      if (!isAutoSpontaneousEnabled) return;
      const now = new Date();
      const hour = now.getHours();
      const min = now.getMinutes();
      const todayStr = `${now.getFullYear()}_${now.getMonth()+1}_${now.getDate()}`;
      const sendBtn = document.getElementById("send-btn");
      const inputElem = document.getElementById("user-input");

      if (sendBtn.disabled || inputElem.value.trim().length > 0) return;

      const lunchKey = `minerva_slot_${todayStr}_lunch`;
      if (hour >= 12 && (hour < 13 || (hour === 13 && min <= 30)) && !localStorage.getItem(lunchKey)) {
        localStorage.setItem(lunchKey, "true");
        return sendMessage("scheduled_lunch");
      }

      const waterKey = `minerva_slot_${todayStr}_water`;
      if (hour >= 15 && hour < 16 && !localStorage.getItem(waterKey)) {
        localStorage.setItem(waterKey, "true");
        return sendMessage("scheduled_water");
      }

      const eveningKey = `minerva_slot_${todayStr}_evening`;
      if ((hour === 17 && min >= 30) || (hour === 18 && min <= 45)) {
        if (!localStorage.getItem(eveningKey)) {
          localStorage.setItem(eveningKey, "true");
          return sendMessage("scheduled_evening");
        }
      }

      const weatherSlotKey = `minerva_weather_${todayStr}_${hour}_${Math.floor(min / 15)}`;
      if (!localStorage.getItem(weatherSlotKey)) {
        localStorage.setItem(weatherSlotKey, "true");
        try {
          const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.91&longitude=140.05&current_weather=true");
          const data = await res.json();
          const weatherCode = data.current_weather?.weathercode || 0;
          if (weatherCode >= 51 && weatherCode <= 99) {
            sendMessage("scheduled_weather_rain");
          }
        } catch(e) {}
      }
    }

    function analyzeFatigueAndEmotion(text, isVoice = false, speechDurationSec = 0) {
      let score = 1;
      const lower = text.toLowerCase();
      const now = new Date();
      const hour = now.getHours();

      if (/限界|しんどい|疲れた|もう無理|死にそう|ドロドロ|助けて|消えたい/.test(lower)) score += 3;
      else if (/つかれた|だるい|ねむい|ふぅ|はぁ|ため息|ふー/.test(lower)) score += 2;
      else if (text.length <= 4 && text.length > 0 && !/^(はい|うん|いいえ|おは|わかった)$/.test(text)) score += 1;

      if (hour >= 23 || hour <= 4) score += 2;
      else if (hour >= 17 && hour <= 20) score += 1;

      if (isVoice && speechDurationSec > 0) {
        const charPerSec = text.length / speechDurationSec;
        if (charPerSec < 2.0) score += 1;
      }

      currentFatigueLevel = Math.max(1, Math.min(5, score));
      updateFatigueUI();
      return currentFatigueLevel;
    }

    function initSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return;
      recognition = new SpeechRec();
      recognition.lang = 'ja-JP';
      recognition.continuous = false;
      recognition.interimResults = false;
      
      recognition.onstart = () => { 
        micStartTime = Date.now(); 
        clearTimeout(micSafetyTimeout);
        micSafetyTimeout = setTimeout(() => {
          if (isMicActive) stopMicInput();
        }, 12000);
      };
      
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript.trim();
        if (transcript) {
          const speechDurationSec = Math.max(1, (Date.now() - micStartTime) / 1000);
          document.getElementById("user-input").value = transcript;
          stopMicInput();
          sendMessage(null, "", true, speechDurationSec);
        } else {
          stopMicInput();
        }
      };

      recognition.onerror = () => stopMicInput();
      recognition.onend = () => stopMicInput();
    }

    function speakIntelligentVoice(speaker, fullText) {
      if (voiceMode === "muted" || !('speechSynthesis' in window)) return;
      
      try {
        window.speechSynthesis.cancel();
      } catch(e) {}

      let targetText = "";
      if (voiceMode === "minerva_only") {
        if (speaker === "ミネルバ") {
          targetText = fullText.split("---")[0];
        } else if (speaker === "円卓会議") {
          fullText.split("\n").forEach(l => {
            if (l.includes("【ミネルバ】") || l.includes("ミネルバ:")) {
              targetText += l.replace(/【.*?】/g, '') + " ";
            }
          });
        }
      } else if (voiceMode === "all_voices") {
        targetText = fullText.split("---")[0];
      }

      if (targetText && targetText.trim()) {
        playSynthesis(speaker, targetText);
      }
    }

    function playSynthesis(speaker, text) {
      const cleanText = text.replace(/（.*?）/g, '').replace(/【.*?】/g, '').replace(/---[\s\S]*/, '').replace(/===[\s\S]*/, '').trim();
      if (!cleanText) return;
      
      const base = baseVoiceProfiles[speaker] || baseVoiceProfiles["ミネルバ"];
      
      let dynamicPitch = base.pitch;
      let dynamicRate = base.rate;
      if (currentFatigueLevel >= 4) {
        dynamicPitch = Math.max(0.7, base.pitch - 0.15);
        dynamicRate = Math.max(0.7, base.rate - 0.2);
      } else if (currentFatigueLevel >= 2) {
        dynamicPitch = Math.max(0.8, base.pitch - 0.08);
        dynamicRate = Math.max(0.8, base.rate - 0.1);
      }

      const utter = new SpeechSynthesisUtterance(cleanText);
      utter.lang = 'ja-JP'; 
      utter.pitch = dynamicPitch; 
      utter.rate = dynamicRate;

      window.activeUtterances.push(utter);
      
      utter.onend = () => {
        window.activeUtterances = window.activeUtterances.filter(u => u !== utter);
      };
      utter.onerror = () => {
        window.activeUtterances = window.activeUtterances.filter(u => u !== utter);
      };

      const voices = window.speechSynthesis.getVoices();
      const jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja_JP');
      if (jaVoice) utter.voice = jaVoice;

      window.speechSynthesis.speak(utter);
    }

    // ⚡ 部屋の同期リスナー
    function setupCloudSync() {
      if (!db || !syncRoomId) return;
      
      const targetP = document.getElementById("persona-select").value || currentPersona;
      const roomRef = db.ref(`minerva_rooms/${syncRoomId}/${targetP}`);
      roomRef.off();

      roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && data.chatHistory && Array.isArray(data.chatHistory)) {
          chatHistory = data.chatHistory;
          cleanOldHistory();
          renderChatBox();
          localStorage.setItem(`minerva_chat_history_${targetP}`, JSON.stringify(chatHistory));
        }
      }, (err) => {
        console.error("Firebase Database Read Error:", err);
      });

      // 共通メトリクスの監視
      db.ref(`minerva_rooms/${syncRoomId}/global_metrics`).on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          if (typeof data.monthlyTokens === "number" && data.monthlyTokens > monthlyTokens) {
            monthlyTokens = data.monthlyTokens;
            updateCostUI(0);
          }
          if (data.battlemapText) {
            localStorage.setItem("minerva_battlemap", data.battlemapText);
          }
        }
      });
    }

    function retrievePastDetails(queryText, allHistory, windowSize = 10) {
      if (allHistory.length <= windowSize) return "";
      
      const olderHistory = allHistory.slice(0, allHistory.length - windowSize);
      const query = queryText.toLowerCase();

      const hasTimeRecall = /今朝|朝|昼|さっき|先ほど|今日|あの話|あの件|前に|昨日|さっき言った/.test(query);
      const words = queryText.match(/[\u4e00-\u9faf\u3040-\u309f\u30a0-\u30ff\w]{2,}/g) || [];
      
      let matchedItems = [];

      olderHistory.forEach((msg, idx) => {
        const text = msg.parts[0].text;
        let score = 0;

        if (hasTimeRecall && idx < 6) score += 2;

        words.forEach(w => {
          if (w.length >= 2 && text.includes(w) && !/^(です|ます|した|こと|もの|から|ので|これ|それ|あれ)$/.test(w)) {
            score += 3;
          }
        });

        if (score > 0) {
          matchedItems.push({ text: `${msg.speaker || (msg.role === 'user' ? '咎魅' : 'AI')}: ${text}`, score: score, index: idx });
        }
      });

      if (matchedItems.length === 0) return "";

      matchedItems.sort((a, b) => b.score - a.score);
      const topMatches = matchedItems.slice(0, 3).map(m => m.text).join("\n---\n");

      return `\n\n【🧠 想起された過去のディテール記憶（朝・昼等の重要文脈）】\n${topMatches}\n（※上記の過去ディテールを踏まえて、文脈を完全に繋げて応答せよ）`;
    }

          const speaker = currentPersona === "円卓会議" ? "ミネルバ" : currentPersona;
          const mainSpeech = fullReply.split("---")[0].replace(/===[\s\S]*/, '').trim();
          const previewText = mainSpeech.length > 180 ? mainSpeech.substring(0, 180) + '...' : mainSpeech;
          showLocalNotification(`💫 ${speaker}からの語りかけ`, previewText);
        }

        let cleanHistoryText = fullReply;
        if (cleanHistoryText.includes("=== 秘密の囁き ===")) {
          cleanHistoryText = cleanHistoryText.split("=== 秘密の囁き ===")[0].trim();
        }

        const aiMsgObj = { 
          role: "model", 
          speaker: currentPersona,
          parts: [{ text: cleanHistoryText }], 
          timestamp: Date.now() 
        };

        chatHistory.push(aiMsgObj);
        saveChatHistory(); pushDataToCloud();
        resetSpontaneousTimer();

      } catch (err) { 
        assistantElem.innerText = `通信エラーが発生したわ……っ：${err.message}`; 
      } finally { 
        sendBtn.disabled = false; 
      }
    }

    function saveChatHistory() { 
      const targetP = document.getElementById("persona-select").value || currentPersona;
      localStorage.setItem(`minerva_chat_history_${targetP}`, JSON.stringify(chatHistory)); 
    }
    function appendMessage(r, t) { const d = document.createElement("div"); d.className = `msg ${r}`; d.innerText = t; document.getElementById("chat-box").appendChild(d); return d; }
    function scrollToBottom() { const b = document.getElementById("chat-box"); b.scrollTop = b.scrollHeight; }
    function scrollToBottomSmooth() { const b = document.getElementById("chat-box"); b.scrollTo({ top: b.scrollHeight, behavior: 'smooth' }); }
    function clearHistory() { 
      if (confirm(`会話履歴を消去するかしら？（※今月分の累計トークン・料金記録はそのまま保持されます）`)) { 
        chatHistory = []; 
        document.getElementById("chat-box").innerHTML = ""; 
        pushDataToCloud(); 
      } 
    }
  </script>
</body>
</html>
