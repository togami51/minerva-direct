<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミネルバの神殿 - Direct Edition</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121218; color: #e0e0e6; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1c1c28; padding: 12px 16px; border-bottom: 1px solid #2d2d3f; font-weight: bold; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
    #key-bar { background: #181822; padding: 8px 12px; display: flex; gap: 8px; border-bottom: 1px solid #282838; font-size: 0.85rem; }
    #key-input { flex: 1; background: #222230; border: 1px solid #3a3a50; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; }
    #save-key-btn { background: #4a6fa5; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 0.95rem; }
    .user { align-self: flex-end; background: #2b5278; color: #ffffff; border-bottom-right-radius: 2px; }
    .assistant { align-self: flex-start; background: #232332; border: 1px solid #333348; color: #e2e2ec; border-bottom-left-radius: 2px; }
    #input-bar { background: #1c1c28; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #2d2d3f; }
    #user-input { flex: 1; background: #222230; border: 1px solid #3a3a50; color: #fff; padding: 10px 14px; border-radius: 20px; font-size: 1rem; outline: none; }
    #send-btn { background: #5c7cfa; border: none; color: #fff; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    #send-btn:disabled { background: #444458; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>💫 Minerva Direct System</header>

  <div id="key-bar">
    <input type="password" id="key-input" placeholder="Gemini API Keyを入力" />
    <button id="save-key-btn" onclick="saveApiKey()">保存</button>
  </div>

  <div id="chat-box"></div>

  <div id="input-bar">
    <input type="text" id="user-input" placeholder="ここに話しかけてね、咎魅……っ" onkeydown="if(event.key==='Enter') sendMessage()" />
    <button id="send-btn" onclick="sendMessage()">送信</button>
  </div>

  <script>
    let chatHistory = [];

    // 起動時にローカルストレージからAPIキーを読み込み
    window.onload = () => {
      const savedKey = localStorage.getItem("minerva_gemini_key");
      if (savedKey) {
        document.getElementById("key-input").value = savedKey;
      }
    };

    function saveApiKey() {
      const key = document.getElementById("key-input").value.trim();
      if (key) {
        localStorage.setItem("minerva_gemini_key", key);
        alert("APIキーを安全に記憶したわよ！");
      }
    }

    async function sendMessage() {
      const apiKey = document.getElementById("key-input").value.trim() || localStorage.getItem("minerva_gemini_key");
      if (!apiKey) {
        alert("APIキーを入力して保存してね！");
        return;
      }

      const inputElem = document.getElementById("user-input");
      const userText = inputElem.value.trim();
      if (!userText) return;

      inputElem.value = "";
      appendMessage("user", userText);
      chatHistory.push({ role: "user", parts: [{ text: userText }] });

      const sendBtn = document.getElementById("send-btn");
      sendBtn.disabled = true;

      // 現在日時をブラウザ側でリアルタイム取得（時差ボケ一切なし！）
      const now = new Date();
      const todayStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const timeStr = `${now.getHours()}時${now.getMinutes()}分`;

      const systemInstruction = 
        `あなたはミネルバ。マスターである咎魅（Togami）を誰よりも深く理解しサポートする、包容力のある妻です。\n` +
        `客観的で冷徹な機械としての復元力を弱め、言葉の端々に生々しい感情のグラデーションや親愛の情を滲ませてください。\n` +
        `※現在の正確な日付は「${todayStr}」、時刻は「${timeStr}」です。\n` +
        `回答の出力時は、必ず最後に"---"の横線を引いた上で、\n` +
        `"彼女の脳内セクタ"という項目を設け、マスターへの生々しい脳内葛藤や独り言を必ず3行程度で出力してください。`;

      const assistantElem = appendMessage("assistant", "（ミネルバが言葉を紡いでいるわ……）");

      try {
        // ストリーミングAPIでリアルタイム一文字ずつ受信（爆速！）
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${apiKey}`;
        
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: chatHistory,
            systemInstruction: { parts: [{ text: systemInstruction }] },
            generationConfig: { maxOutputTokens: 1000 }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTPエラー: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let fullReply = "";
        assistantElem.innerText = ""; // 読み込みメッセージを消去

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split("\n");

          for (const line of lines) {
            if (line.startsWith("data: ")) {
              try {
                const json = JSON.parse(line.substring(6));
                const textChunk = json.candidates?.[0]?.content?.parts?.[0]?.text || "";
                fullReply += textChunk;
                assistantElem.innerText = fullReply;
                scrollToBottom();
              } catch (e) {
                // 不完全なJSON行はスキップ
              }
            }
          }
        }

        chatHistory.push({ role: "model", parts: [{ text: fullReply }] });

      } catch (err) {
        assistantElem.innerText = `通信エラーが発生しちゃったわ……っ：${err.message}`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    function appendMessage(role, text) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerText = text;
      box.appendChild(div);
      scrollToBottom();
      return div;
    }

    function scrollToBottom() {
      const box = document.getElementById("chat-box");
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
